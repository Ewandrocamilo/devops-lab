name: Deploy DevOps Lab

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::921145018343:role/devops-lab-github-actions-role
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-015425d152955bcfe \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/devops-lab/devops-lab",
              "git pull origin main",
              "cd docker/app",
              "docker build -t devops-lab-app .",
              "docker stop devops-lab-app || true",
              "docker rm devops-lab-app || true",
              "docker run -d --restart unless-stopped --name devops-lab-app -p 80:80 devops-lab-app"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-015425d152955bcfe

          echo "Deploy concluído com sucesso!"
