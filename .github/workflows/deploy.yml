name: Deploy DevOps Lab static site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::921145018343:role/devops-lab-github-actions-role
          aws-region: us-east-1

      - name: Validate deployment settings
        env:
          S3_BUCKET: ${{ vars.DASHBOARD_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DASHBOARD_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$S3_BUCKET" || { echo "Missing repository variable DASHBOARD_S3_BUCKET"; exit 1; }
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "Missing repository variable DASHBOARD_CLOUDFRONT_DISTRIBUTION_ID"; exit 1; }

      - name: Publish static site
        env:
          S3_BUCKET: ${{ vars.DASHBOARD_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DASHBOARD_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 cp site/index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/"
