apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: devops-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: kennethreitz/httpbin

        ports:
        - containerPort: 80
