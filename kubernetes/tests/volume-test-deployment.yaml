apiVersion: v1
kind: Pod

metadata:
  name: volume-test
  namespace: devops-lab
  labels:
    app: volume-test

spec:
  containers:
    - name: alpine
      image: alpine:latest

      command:
        - sleep
        - infinity

      volumeMounts:
        - name: dados
          mountPath: /dados

  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: devops-lab-pvc
